name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qml-lint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      - name: qmllint
        run: |
          mapfile -t files < <(find contents -name '*.qml' -print | sort)
          printf '%s\n' "${files[@]}"
          qmllint "${files[@]}"

  package-install:
    name: Plasma package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata.json
        run: python3 -c "import json; json.load(open('metadata.json'))"

      - name: Install Plasma 6 package tooling
        # kpackagetool6 is packaged from 26.04 on; plasma-desktoptheme ships the
        # KF6 Plasma/Applet package structure plugin that --type needs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kpackagetool6 plasma-desktoptheme

      - name: kpackagetool6 --install
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg"
          kpackagetool6 --type Plasma/Applet --install .
          kpackagetool6 --type Plasma/Applet --list
